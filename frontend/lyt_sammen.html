<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Next-track</title>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="#">næste</a>

        <nav>
            <a href="index.html">Lyt selv</a>
            <a class="active" href="lyt_sammen.html">Lyt sammen</a>
        </nav>

        <a class="profile" href="#" aria-label="Profil">S</a>
    </header>

    <main class="page">
        <section class="genres">

         <div class="intro">
            <h1>I vælger genre.</h1>
            <h1>Vi vælger de næste tracks.</h1>
        </div>

        <h2>Hvad har i lyst til?</h2>

        <button class="electronic genre-button">
            <span class="genre-title">Elektronisk</span>
            <span class="check-circle"></span>
        </button> 

        <button class="jazz genre-button">
            <span class="genre-title">Jazz</span>
            <span class="check-circle"></span>
        </button>

        <button class="hiphop genre-button">
            <span class="genre-title">Hip-hop</span>
            <span class="check-circle"></span>
        </button>

        <button class="indie genre-button">
            <span class="genre-title">Indie</span>
            <span class="check-circle"></span>
        </button>

        <button class="pop genre-button">
            <span class="genre-title">Pop</span>
            <span class="check-circle"></span>
        </button>

        <button class="soul genre-button">
            <span class="genre-title">Soul</span>
            <span class="check-circle"></span>
        </button>

        <button class="rock genre-button">
            <span class="genre-title">Rock</span>
            <span class="check-circle"></span>
        </button>

        <button class="klassisk genre-button">
            <span class="genre-title">Klassisk</span>
            <span class="check-circle"></span>
        </button>

        <button class="udforsk genre-button">
            <span class="genre-title">Udforsk</span>
            <span class="check-circle"></span>
        </button>

        </section>

        <aside class="player">
            <h1>Læn jer tilbage.</h1> 

        <div class="genre-image">
            <img id="genre-cover" src="/images/elektronisk.png" alt="Genre cover">
        </div>
        </aside>
    </main>

    <footer class="player-bar" aria-label="Musikafspiller">
        <audio class="player-controls" controls src="demo.wav" preload="metadata" aria-label="Afspilning af lydprøve"></audio>
    </footer>

</body>
</html>
