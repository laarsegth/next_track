<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Next-track</title>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="#">Next-track</a>

        <nav>
            <a class="active" href="#">Lyt selv</a>
            <a href="lyt_sammen.html">Lyt sammen</a>
        </nav>

        <a class="profile" href="#" aria-label="Profil">S</a>
    </header>

    <main class="page">
        <section class="genres">

        <div class="intro">
            <h1>Du vælger genren.</h1>
            <h1>Vi vælger næste track.</h1>
        </div>

        <h2>Hvad har du lyst til?</h2>
       
          
        <button type="button" class="electronic genre-button" data-cover="elektronisk.png" aria-pressed="false">
            <span class="genre-title">Elektronisk</span>
            <span class="check-circle"></span>
        </button> 

    
        <button type="button" class="jazz genre-button" data-cover="jazz.png" aria-pressed="false">
            <span class="genre-title">Jazz</span>
            <span class="check-circle"></span>
        </button>


        <button type="button" class="hiphop genre-button" data-cover="hiphop.png" aria-pressed="false">
            <span class="genre-title">Hip-hop</span>
            <span class="check-circle"></span>
        </button>

        <button type="button" class="indie genre-button" data-cover="indie.png" aria-pressed="false">
            <span class="genre-title">Indie</span>
            <span class="check-circle"></span>
        </button>

        <button type="button" class="pop genre-button" data-cover="pop.png" aria-pressed="false">
            <span class="genre-title">Pop</span>
            <span class="check-circle"></span>
        </button>

        <button type="button" class="soul genre-button" data-cover="soul.png" aria-pressed="false">
            <span class="genre-title">Soul</span>
            <span class="check-circle"></span>
        </button>

        <button type="button" class="rock genre-button" data-cover="rock.png" aria-pressed="false">
            <span class="genre-title">Rock</span>
            <span class="check-circle"></span>
        </button>

        <button type="button" class="klassisk genre-button" data-cover="klassisk.png" aria-pressed="false">
            <span class="genre-title">Klassisk</span>
            <span class="check-circle"></span>
        </button>

        <button type="button" class="udforsk genre-button" data-cover="udforsk.png" aria-pressed="false">
            <span class="genre-title">Udforsk</span>
            <span class="check-circle"></span>
        </button>

        </section>

        <aside class="player">
         <h1>Læn dig tilbage!</h1> 

        <div class="genre-image">
            <img id="genre-cover" src="/images/elektronisk.png" alt="Cover til Elektronisk">
            <span id="genre-cover-label" hidden></span>
        </div>
        </aside>
    </main>

    <footer class="player-bar" aria-label="Musikafspiller">
        <audio class="player-controls" controls src="demo.wav" preload="metadata" aria-label="Afspilning af lydprøve"></audio>
    </footer>
    <script src="script.js"></script>
</body>
</html>
